name: GHYSJ TNF docking v2

on:
  push:
    branches:
      - ghysj-tnf-docking-20260816
    paths:
      - 'docking/run_ghysj_tnf_docking_v2.py'
      - '.github/workflows/ghysj_tnf_docking_v2.yml'
  workflow_dispatch:

jobs:
  docking:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install preparation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'rdkit>=2024.3' 'meeko==0.7.1' numpy scipy gemmi
      - name: Install AutoDock Vina 1.2.7
        run: |
          mkdir -p "$HOME/bin"
          curl -L --retry 3 --fail 'https://github.com/ccsb-scripps/AutoDock-Vina/releases/download/v1.2.7/vina_1.2.7_linux_x86_64' -o "$HOME/bin/vina"
          chmod +x "$HOME/bin/vina"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Run docking v2
        run: python docking/run_ghysj_tnf_docking_v2.py --out GHYSJ_TNF_Docking_Result
      - name: Package result
        run: python -c "import shutil; shutil.make_archive('GHYSJ_TNF_Docking_Result','zip','GHYSJ_TNF_Docking_Result')"
      - uses: actions/upload-artifact@v4
        with:
          name: GHYSJ_TNF_Docking_Result_v2
          path: GHYSJ_TNF_Docking_Result.zip
          if-no-files-found: error
          retention-days: 30
